name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: milliewalky/setup-7-zip@v2
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Pre-seed Electron v5.0.2 Cache
        shell: powershell
        run: |
          # Ensure the exact target cache folder structure exists
          $cacheDir = "cache\v5.0.2"
          if (!(Test-Path -Path $cacheDir)) {
              New-Item -ItemType Directory -Force -Path $cacheDir
          }
          
          # Download the official, uncorrupted binary directly from GitHub
          $url = "https://github.com"
          $outputFile = Join-Path $cacheDir "electron-v5.0.2-win32-x64.zip"
          
          Write-Host "Downloading Electron binary from $url to $outputFile..."
          Invoke-WebRequest -Uri $url -OutFile $outputFile
          Write-Host "Download complete."

      - name: Build
        run: |
          npm install
          copy config-default.json config.json
          gulp build
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: win32-x64
      
          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: release/win32-x64
